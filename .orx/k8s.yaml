apiVersion: batch/v1
kind: Job
metadata:
  name: planphys-{{ORX_RUN}}
spec:
  activeDeadlineSeconds: 3600
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: planphys-reproduction
    spec:
      restartPolicy: Never
      containers:
        - name: evaluator
          image: pytorch/pytorch:2.8.0-cuda12.8-cudnn9-runtime
          command: ["bash", "-c", "bash -lc \"$ORX_SCRIPT\""]
          env:
            - name: HF_HOME
              value: /cache/huggingface
            - name: PIP_CACHE_DIR
              value: /cache/pip
            - name: TOKENIZERS_PARALLELISM
              value: "false"
          resources:
            requests:
              cpu: "4"
              memory: 16Gi
            limits:
              cpu: "4"
              memory: 16Gi
          volumeMounts:
            - name: cache
              mountPath: /cache
      volumes:
        - name: cache
          emptyDir:
            sizeLimit: 30Gi
