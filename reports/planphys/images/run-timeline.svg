<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="500" viewBox="0 0 1100 500" role="img" aria-labelledby="title desc">
  <title id="title">Kubernetes run timeline</title>
  <desc id="desc">Two batches of four 4-GPU jobs failed during setup, then a CPU verifier audit succeeded. Peak GPU allocation was 16 and elapsed wall time was 337 seconds.</desc>
  <rect width="1100" height="500" fill="#ffffff"/>
  <text x="55" y="55" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#0f172a">Kubernetes execution timeline</text>
  <text x="55" y="86" font-family="Arial, sans-serif" font-size="16" fill="#64748b">15:27:22Z–15:32:59Z · peak 16 RTX PRO 6000 Blackwell GPUs · 337 s elapsed</text>
  <g font-family="Arial, sans-serif">
    <line x1="220" y1="128" x2="760" y2="128" stroke="#cbd5e1"/>
    <text x="220" y="116" font-size="14" fill="#64748b">0 min</text>
    <text x="490" y="116" text-anchor="middle" font-size="14" fill="#64748b">3 min</text>
    <text x="760" y="116" text-anchor="end" font-size="14" fill="#64748b">5.6 min</text>

    <text x="55" y="190" font-size="18" fill="#334155">GPU batch 1</text>
    <rect x="220" y="160" width="28" height="42" rx="7" fill="#f59e0b"/>
    <text x="260" y="187" font-size="15" fill="#92400e">4 jobs × 4 GPUs · shell setup failure</text>

    <text x="55" y="275" font-size="18" fill="#334155">GPU batch 2</text>
    <rect x="414" y="245" width="84" height="42" rx="7" fill="#f97316"/>
    <text x="510" y="272" font-size="15" fill="#9a3412">4 jobs × 4 GPUs · inference blocked</text>

    <text x="55" y="360" font-size="18" fill="#334155">CPU audit</text>
    <rect x="700" y="330" width="60" height="42" rx="7" fill="#22c55e"/>
    <text x="688" y="357" text-anchor="end" font-size="15" fill="#166534">36 s · completed</text>

    <rect x="220" y="415" width="18" height="18" fill="#f59e0b"/>
    <text x="248" y="429" font-size="14" fill="#475569">Setup failure</text>
    <rect x="360" y="415" width="18" height="18" fill="#f97316"/>
    <text x="388" y="429" font-size="14" fill="#475569">Compatibility failure</text>
    <rect x="590" y="415" width="18" height="18" fill="#22c55e"/>
    <text x="618" y="429" font-size="14" fill="#475569">Successful audit</text>
  </g>
</svg>
